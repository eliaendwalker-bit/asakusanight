<!doctype html>
<html>
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<title>AsakusaNight Mock</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; width:1280px; height:720px; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#0b0d14; color:#eee;
  }
  #scene {
    position:relative; width:1280px; height:560px;
    background: linear-gradient(180deg,#3a1030 0%,#5c1a1a 35%,#2a1308 70%,#120a05 100%);
    border-bottom:2px solid #d4af37;
  }
  .gate {
    position:absolute; bottom:0; left:480px; width:320px; height:260px;
    background:#8a1f1f; border:6px solid #d4af37;
  }
  .gate::before{
    content:""; position:absolute; top:-30px; left:-20px; right:-20px; height:40px;
    background:#5a1313; border:4px solid #d4af37;
  }
  .lantern{
    position:absolute; left:600px; top:60px; width:80px; height:110px;
    background:#c93b2e; border-radius:40px; border:3px solid #d4af37;
  }
  .boss {
    position:absolute; right:140px; bottom:20px; width:100px; height:220px;
    background:#1a1a1a; border:2px solid #555; border-radius:10px 10px 0 0;
  }
  .player {
    position:absolute; left:160px; bottom:20px; width:70px; height:180px;
    background:#2b3a67; border:2px solid #88aaff; border-radius:10px 10px 0 0;
  }
  #hud {
    position:absolute; top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between; font-size:13px;
  }
  .barwrap { width:260px; }
  .barlabel { margin-bottom:3px; }
  .barbg { background:#222; border:1px solid #666; height:14px; width:100%; }
  .barfill { height:100%; background:#4caf50; }
  #boss-bar .barfill { background:#c62828; }
  #stamina-bar .barfill { background:#ffb300; }
  #wallet-status { color:#ffd54f; font-weight:bold; }

  #controls {
    position:absolute; bottom:10px; left:10px; display:flex; gap:10px;
  }
  button {
    background:#d4af37; border:none; color:#1a1208; font-weight:bold;
    padding:10px 16px; border-radius:6px; cursor:pointer; font-size:14px;
  }
  button:disabled { background:#555; color:#999; cursor:default; }

  #panel {
    position:absolute; top:160px; left:340px; width:600px;
    background:#11131a; border:2px solid #d4af37; border-radius:8px;
    padding:20px; text-align:center; display:none;
  }
  #panel h2 { margin:4px 0; color:#ffdd77; }
  #nft-box {
    margin-top:12px; border:2px dashed #d4af37; border-radius:6px; padding:14px;
    display:none; background:#1b1420;
  }
  #nft-box svg { width:70px; height:70px; }
  .small { font-size:12px; color:#bbb; }

  footer {
    position:absolute; bottom:4px; right:10px; font-size:11px; color:#777;
  }
</style>
</head>
<body>

<div id="scene" data-demo="scene">
  <div class="gate"></div>
  <div class="lantern"></div>
  <div class="player" data-demo="player"></div>
  <div class="boss" data-demo="boss"></div>

  <div id="hud">
    <div class="barwrap">
      <div class="barlabel">Player HP</div>
      <div class="barbg"><div class="barfill" style="width:80%" data-demo="player-health"></div></div>
      <div class="barlabel" id="stamina-bar">Stamina</div>
      <div class="barbg"><div class="barfill" style="width:65%" data-demo="player-stamina"></div></div>
    </div>
    <div class="barwrap">
      <div class="barlabel">Boss HP: <span data-demo="boss-health-text">100</span>%</div>
      <div class="barbg" id="boss-bar"><div class="barfill" style="width:100%" data-demo="boss-health-bar"></div></div>
      <div class="barlabel">Wallet: <span id="wallet-status" data-demo="wallet-status">Not Connected</span></div>
    </div>
  </div>

  <div id="controls">
    <button data-demo="attack-btn" onclick="attack()">Attack Boss</button>
    <button data-demo="dodge-btn">Dodge</button>
  </div>

  <div id="panel" data-demo="victory-panel">
    <h2 data-demo="victory-text">Boss Defeated!</h2>
    <p class="small">A Solana wallet connection is now available to claim your relic.</p>
    <button data-demo="connect-wallet-btn" onclick="connectWallet()">Connect Wallet</button>
    <button data-demo="mint-btn" style="display:none" onclick="mintNFT()">Mint Spirit Seal NFT</button>

    <div id="nft-box" data-demo="nft-panel">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#d4af37" stroke="#fff" stroke-width="3"/><text x="50" y="58" font-size="30" text-anchor="middle" fill="#2a1a08">印</text></svg>
      <p><b>Spirit Seal #1</b><br>1-of-1 Metaplex Core NFT</p>
      <p class="small" data-demo="mint-tx">Tx: 5fQ2...9aXk — Minted on Solana</p>
    </div>
  </div>
</div>

<footer>Prototype — all data is simulated</footer>

<script>
  var bossHealth = 100;
  function attack(){
    if(bossHealth <= 0) return;
    bossHealth -= 50;
    if(bossHealth < 0) bossHealth = 0;
    document.querySelector('[data-demo="boss-health-bar"]').style.width = bossHealth + "%";
    document.querySelector('[data-demo="boss-health-text"]').textContent = bossHealth;
    if(bossHealth === 0){
      document.querySelector('[data-demo="attack-btn"]').disabled = true;
      document.getElementById('panel').style.display = "block";
    }
  }
  function connectWallet(){
    document.getElementById('wallet-status').textContent = "Connected: 7xDk...3kJ2";
    document.querySelector('[data-demo="connect-wallet-btn"]').style.display = "none";
    document.querySelector('[data-demo="mint-btn"]').style.display = "inline-block";
  }
  function mintNFT(){
    document.getElementById('nft-box').style.display = "block";
    document.querySelector('[data-demo="mint-btn"]').disabled = true;
    document.querySelector('[data-demo="mint-btn"]').textContent = "Minted ✓";
  }
</script>
</body>
</html>
